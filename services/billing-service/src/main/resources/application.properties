spring.application.name=billing-service
server.port=${PORT:8083}
# Local-by-default; bearer JWT validation protects non-health API routes.
server.address=${BILLING_SERVER_ADDRESS:127.0.0.1}

spring.datasource.url=jdbc:postgresql://${BILLING_DB_HOST:localhost}:${BILLING_DB_PORT:5432}/${BILLING_DB_NAME:db_billing}
spring.datasource.username=${BILLING_DB_USERNAME:billing_app}
spring.datasource.password=${BILLING_DB_PASSWORD:billing_app_dev_only}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=ParkFlowBillingPool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.enabled=${BILLING_FLYWAY_ENABLED:false}
spring.flyway.user=${BILLING_DB_MIGRATION_USERNAME:${BILLING_DB_USERNAME:billing_app}}
spring.flyway.password=${BILLING_DB_MIGRATION_PASSWORD:${BILLING_DB_PASSWORD:billing_app_dev_only}}

logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.com.parkflow=INFO
billing.parking.grace-minutes=${PARKFLOW_GRACE_MINUTES:15}
parkflow.security.jwt.issuer=${IDENTITY_JWT_ISSUER:https://identity.parkflow.local}
parkflow.security.jwt.audience=${IDENTITY_JWT_AUDIENCE:parkflow-api}
parkflow.security.jwt.jwk-set-uri=${IDENTITY_JWKS_URI:http://127.0.0.1:8081/.well-known/jwks.json}
