# Activar explícitamente con SPRING_PROFILES_ACTIVE=migrate. Usar una cuenta migrator distinta de billing_app.
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://${BILLING_DB_HOST:localhost}:${BILLING_DB_PORT:5432}/${BILLING_DB_NAME:db_billing}
spring.flyway.user=${BILLING_DB_MIGRATION_USERNAME:billing_migrator}
spring.flyway.password=${BILLING_DB_MIGRATION_PASSWORD:billing_migrator_dev_only}
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=none
