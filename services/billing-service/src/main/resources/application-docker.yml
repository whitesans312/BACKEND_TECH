server:
  port: ${PORT:8083}
  address: ${BILLING_SERVER_ADDRESS:0.0.0.0}

spring:
  datasource:
    url: jdbc:postgresql://${BILLING_DB_HOST:postgres}:${BILLING_DB_PORT:5432}/${BILLING_DB_NAME:db_billing}
    username: ${BILLING_DB_USERNAME:billing_app}
    password: ${BILLING_DB_PASSWORD:billing_app_dev_only}
  flyway:
    enabled: ${BILLING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    user: ${BILLING_DB_MIGRATION_USERNAME:billing_migrator}
    password: ${BILLING_DB_MIGRATION_PASSWORD:billing_migrator_dev_only}

parkflow:
  security:
    jwt:
      issuer: ${IDENTITY_JWT_ISSUER:https://identity.parkflow.local}
      audience: ${IDENTITY_JWT_AUDIENCE:parkflow-api}
      jwk-set-uri: ${IDENTITY_JWKS_URI:http://identity-service:8081/.well-known/jwks.json}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
