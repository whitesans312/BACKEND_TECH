# Activar explícitamente con SPRING_PROFILES_ACTIVE=migrate.
# La cuenta identity_migrator ejecuta migraciones; identity_app se reserva para la aplicación.
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://${IDENTITY_DB_HOST:localhost}:${IDENTITY_DB_PORT:5432}/${IDENTITY_DB_NAME:db_identity}
spring.flyway.user=${IDENTITY_DB_MIGRATION_USERNAME:identity_migrator}
spring.flyway.password=${IDENTITY_DB_MIGRATION_PASSWORD:identity_migrator_dev_only}
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=none
