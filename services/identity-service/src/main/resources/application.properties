spring.application.name=identity-service
server.port=${PORT:8081}
spring.datasource.url=jdbc:postgresql://${IDENTITY_DB_HOST:localhost}:${IDENTITY_DB_PORT:5432}/${IDENTITY_DB_NAME:db_identity}
spring.datasource.username=${IDENTITY_DB_USERNAME:identity_app}
spring.datasource.password=${IDENTITY_DB_PASSWORD:identity_app_dev_only}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=${IDENTITY_FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.user=${IDENTITY_DB_MIGRATION_USERNAME:${IDENTITY_DB_USERNAME:identity_app}}
spring.flyway.password=${IDENTITY_DB_MIGRATION_PASSWORD:${IDENTITY_DB_PASSWORD:identity_app_dev_only}}
spring.flyway.clean-disabled=true
identity.jwt.issuer=${IDENTITY_JWT_ISSUER:https://identity.parkflow.local}
identity.jwt.audience=${IDENTITY_JWT_AUDIENCE:parkflow-api}
identity.jwt.key-id=${IDENTITY_JWT_KEY_ID:parkflow-2026-01}
identity.jwt.private-key-b64=${IDENTITY_JWT_PRIVATE_KEY_B64:}
identity.jwt.public-key-b64=${IDENTITY_JWT_PUBLIC_KEY_B64:}
identity.jwt.ttl=PT15M
logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.com.parkflow=INFO
