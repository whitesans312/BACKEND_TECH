spring.application.name=parking-service
server.port=${PORT:8080}
server.address=${PARKING_SERVER_ADDRESS:127.0.0.1}

spring.datasource.url=jdbc:postgresql://${PARKING_DB_HOST:localhost}:${PARKING_DB_PORT:5432}/${PARKING_DB_NAME:db_parking}
spring.datasource.username=${PARKING_DB_USERNAME:parking_app}
spring.datasource.password=${PARKING_DB_PASSWORD:parking_app_dev_only}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.pool-name=ParkFlowParkingPool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=${PARKING_FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.user=${PARKING_DB_MIGRATION_USERNAME:${PARKING_DB_USERNAME:parking_app}}
spring.flyway.password=${PARKING_DB_MIGRATION_PASSWORD:${PARKING_DB_PASSWORD:parking_app_dev_only}}
spring.flyway.clean-disabled=true

logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.com.parkflow=INFO
parkflow.security.jwt.issuer=${IDENTITY_JWT_ISSUER:https://identity.parkflow.local}
parkflow.security.jwt.audience=${IDENTITY_JWT_AUDIENCE:parkflow-api}
parkflow.security.jwt.jwk-set-uri=${IDENTITY_JWKS_URI:http://127.0.0.1:8081/.well-known/jwks.json}
parkflow.billing.base-url=${BILLING_SERVICE_URL:http://127.0.0.1:18082}
