# Este perfil ejecuta Flyway con una cuenta de migraciones separada de parking_app.
# Definir PARKING_DB_MIGRATION_USERNAME y PARKING_DB_MIGRATION_PASSWORD antes de activarlo.
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://${PARKING_DB_HOST:localhost}:${PARKING_DB_PORT:5432}/${PARKING_DB_NAME:db_parking}
spring.flyway.user=${PARKING_DB_MIGRATION_USERNAME:parking_migrator}
spring.flyway.password=${PARKING_DB_MIGRATION_PASSWORD:parking_migrator_dev_only}
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=none
